<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Flow Lines & Connecting Nodes (Strategic Sourcing Lifecycle Visual) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 120 270 Q 350 220 550 270 T 950 250 T 1120 280" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M 80 100 Q 300 160 620 100 T 1020 120" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="90" r="80" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1020" cy="220" r="100" fill="#7c3aed" opacity="0.18" filter="url(#glow)" />

  <!-- Animated Glowing Workflow Nodes -->
  <g transform="translate(0, 0)">
    <circle cx="150" cy="270" r="7" fill="#38bdf8" class="pulse-circle" filter="url(#subtleGlow)"/>
    <text x="150" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">RFx / TENDER</text>

    <circle cx="420" cy="245" r="7" fill="#818cf8" class="pulse-circle" filter="url(#subtleGlow)"/>
    <text x="420" y="273" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">E-AUCTIONS</text>

    <circle cx="700" cy="265" r="7" fill="#a855f7" class="pulse-circle" filter="url(#subtleGlow)"/>
    <text x="700" y="293" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">BID OPTIMIZATION</text>

    <circle cx="1020" cy="255" r="7" fill="#ec4899" class="pulse-circle" filter="url(#subtleGlow)"/>
    <text x="1020" y="283" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="600">AWARD &amp; SAVINGS</text>
  </g>

  <!-- Header Category Badge -->
  <g transform="translate(60, 40)">
    <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="19" class="tag-text" fill="#cbd5e1">STRATEGIC SOURCING &amp; RFX</text>
  </g>

  <!-- Title Text -->
  <g transform="translate(60, 118)">
    <text class="title-text" fill="url(#textGradient)" filter="url(#subtleGlow)">
      Awesome Strategic Sourcing Platforms
    </text>
  </g>

  <!-- Subtitle Text -->
  <g transform="translate(60, 155)">
    <text class="subtitle-text">
      Curated ecosystem of SaaS &amp; Open-Source tools for RFx, E-Auctions, Supplier Selection, Bid Optimization &amp; Spend Intelligence
    </text>
  </g>

  <!-- Feature Tags -->
  <g transform="translate(60, 185)">
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="65" y="17" class="tag-text" fill="#a5b4fc" text-anchor="middle">🎯 RFx &amp; E-Auctions</text>
    </g>
    <g transform="translate(140, 0)">
      <rect width="145" height="26" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="72.5" y="17" class="tag-text" fill="#7dd3fc" text-anchor="middle">⚡ Bid Optimization</text>
    </g>
    <g transform="translate(295, 0)">
      <rect width="145" height="26" rx="6" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
      <text x="72.5" y="17" class="tag-text" fill="#d8b4fe" text-anchor="middle">🤝 Supplier Selection</text>
    </g>
    <g transform="translate(450, 0)">
      <rect width="155" height="26" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="77.5" y="17" class="tag-text" fill="#6ee7b7" text-anchor="middle">📊 Spend Intelligence</text>
    </g>
    <g transform="translate(615, 0)">
      <rect width="130" height="26" rx="6" fill="#451a03" stroke="#d97706" stroke-width="1"/>
      <text x="65" y="17" class="tag-text" fill="#fcd34d" text-anchor="middle">🔓 Open-Source</text>
    </g>
  </g>
</svg>
